<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Training Log</title>
    <meta name="description" content="A gym log that knows the weights your gym has. Works offline and installs on a phone." />
    <meta name="theme-color" content="#E9ECEE" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Training" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* Painted before the stylesheet arrives, so there is no white flash on a dark phone. */
      html { background: #E9ECEE; }
      @media (prefers-color-scheme: dark) { html { background: #11181E; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Training Log needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
